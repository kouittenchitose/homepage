<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細 | 光一天</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/site-nav.css">
  <style>
    :root {
      --primary: #facc15; --primary-hover: #eab308; --anniv-color: #ef4444;
      --bg-main: #f5f5f7; --bg-surface: #ffffff;
      --text-main: #1d1d1f; --text-sub: #86868b;
      --line: #e5e5ea;
      --nav-height: 64px; --font-serif: 'Shippori Mincho', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding-top: calc(var(--nav-height) + 20px); }
    
    .container { max-width: 800px; margin: 0 auto 3rem; background: var(--bg-surface); padding: 32px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-family: var(--font-serif); font-size: 2rem; margin-bottom: 1rem; line-height: 1.4; }
    img { max-width: 100%; border-radius: 12px; margin: 18px 0; }
    .body { white-space: pre-wrap; line-height: 1.8; color: #333; overflow-wrap: anywhere; }
    .back-btn { display: inline-block; margin-bottom: 16px; text-decoration: none; color: var(--text-sub); font-weight: 700; transition: 0.2s; }
    .back-btn:hover { color: var(--text-main); }
    
    .news-images { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
    .news-image { width: 100%; border-radius: 12px; margin: 0; }
    .link-cards { display: grid; gap: 15px; margin: 30px 0; }
    .link-card { display: flex; gap: 15px; text-decoration: none; color: inherit; background: #fafafa; border: 1px solid var(--line); border-radius: 12px; padding: 12px; transition: 0.2s; align-items: stretch; }
    .link-card:hover { background: #f0f0f0; }
    .link-card-img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; background: #ddd; flex-shrink: 0; margin: 0; }
    .link-card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .link-card-title { font-weight: 800; font-size: 1rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .link-card-desc { font-size: 0.85rem; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    @media (max-width: 768px) {
      .container { margin: 10px; padding: 18px; border-radius: 14px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo-container">
      <div id="logo-area"></div>
      <span class="nav-logo-text">光一天</span>
    </a>
    <div class="nav-links" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">チーム紹介</a>
      <a href="works.html">作品一覧</a>
      <a href="news.html" class="active">お知らせ</a>
      <a href="contact.html">連絡先</a>
      <a href="10th-anniv.html" class="nav-anniv-btn">10周年記念公演</a>
      <a href="sponsors.html" class="nav-sponsors-btn">協賛</a>
    </div>
    <div class="hamburger" onclick="toggleMenu()" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="container" id="content">読み込み中...</div>

  <script src="shared/site-shell.js"></script>
  <script>
    function escapeHtml(str) {
      if (str == null || str === '') return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function load() {
      const assets = await loadSharedLogo();

      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        document.getElementById('content').innerHTML = '<a href="news.html" class="back-btn">← 一覧に戻る</a><p>記事が見つかりません。</p>';
        return;
      }
      try {
        const res = await fetch(`/api/content?type=news&id=${id}`, { cache: 'no-cache' });
        if(!res.ok) throw new Error();
        
        // パースエラー対策
        const text = await res.text();
        const data = JSON.parse(text);
        
        const images = data.images && data.images.length > 0 ? data.images : (data.image ? [data.image] : []);
        const imagesHtml = images.length > 0 ? `<div class="news-images">${images.map(img => `<img src="${escapeHtml(img)}" class="news-image">`).join('')}</div>` : '';

        const linksHtml = data.links && data.links.length > 0 ? `<div class="link-cards">${data.links.map(link => `
          <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="link-card">
            ${link.image ? `<img src="${escapeHtml(link.image)}" class="link-card-img">` : '<div class="link-card-img"></div>'}
            <div class="link-card-content">
              <div class="link-card-title">${escapeHtml(link.title || link.url)}</div>
              ${link.description ? `<div class="link-card-desc">${escapeHtml(link.description)}</div>` : ''}
            </div>
          </a>
        `).join('')}</div>` : '';

        document.getElementById('content').innerHTML = `
          <a href="news.html" class="back-btn">← 一覧に戻る</a>
          <p style="color:var(--text-sub); font-size:0.9rem; font-weight:700; margin-bottom:10px;">${escapeHtml(data.date || '')} | ${escapeHtml(data.tag || '')}</p>
          <h1>${escapeHtml(data.title || '無題')}</h1>
          ${imagesHtml}
          <div class="body">${escapeHtml(data.body || '')}</div>
          ${linksHtml}
        `;
      } catch(e) { 
        console.error('[News Detail Error]', e);
        document.getElementById('content').innerHTML = '<a href="news.html" class="back-btn">← 一覧に戻る</a><p>記事の取得に失敗しました。</p>'; 
      }
    }
    load();
  </script>
  <script src="anniv-visibility.js"></script>
</body>
</html>
