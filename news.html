<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ一覧 | 光一天（こういってん）</title>
  <meta name="description" content="公立千歳科学技術大学「光一天（こういってん）」のお知らせ。公式ホームページ。">
  <meta name="robots" content="index, follow">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/site-nav.css">
  <style>
    :root {
      --primary: #facc15; --primary-hover: #eab308; --anniv-color: #ef4444;
      --bg-main: #f5f5f7; --bg-surface: #ffffff;
      --text-main: #1d1d1f; --text-sub: #86868b;
      --line: #e5e5ea; --error: #ef4444;
      --nav-height: 64px; --font-serif: 'Shippori Mincho', serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; padding-top: var(--nav-height); }
    h1, h2, .serif { font-family: var(--font-serif); }

    .container { width: min(1100px, 92%); margin: 0 auto; padding: 2rem 0 4rem; }
    .page-head { margin-bottom: 1.5rem; }
    .page-title { font-size: clamp(2.1rem, 5vw, 3.6rem); line-height: 1.2; margin-bottom: 0.75rem; }
    .page-desc { color: var(--text-sub); max-width: 720px; }

    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
    .search-box { display: flex; gap: 0.75rem; background: var(--bg-surface); border: 1px solid var(--line); border-radius: 16px; padding: 0.75rem 1rem; }
    .search-input { width: 100%; border: none; outline: none; background: transparent; color: var(--text-main); font-size: 1rem; }
    .search-button, .reset-button { border: none; cursor: pointer; font-weight: 700; border-radius: 999px; padding: 0.8rem 1.2rem; font-size: 0.95rem; }
    .search-button { background: var(--primary); color: #1d1d1f; }
    .reset-button { background: #ededf0; color: var(--text-main); }

    .news-list { display: grid; gap: 1rem; }
    .news-card { display: flex; gap: 1.5rem; align-items: stretch; text-decoration: none; color: inherit; background: var(--bg-surface); border-radius: 22px; padding: 1.2rem 1.3rem; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 6px 24px rgba(0,0,0,0.04); }
    .news-card-content { flex: 1; min-width: 0; }
    .news-card-thumb { width: 140px; height: 100px; object-fit: cover; border-radius: 12px; background: #eee; flex-shrink: 0; }
    .news-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 0.65rem; font-size: 0.85rem; font-weight: 700; }
    .news-date { color: var(--text-sub); }
    .news-tag { display: inline-block; border-radius: 999px; padding: 0.2rem 0.7rem; background: #fff4f5; color: #b42318; font-size: 0.78rem; }
    .news-title { font-size: 1.15rem; font-weight: 800; line-height: 1.5; margin-bottom: 0.5rem; }
    .news-body { color: var(--text-sub); font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }

    .status, .empty { text-align: center; color: var(--text-sub); padding: 2rem 1rem; }
    .status.error { color: var(--error); }

    @media (max-width: 768px) {
      .toolbar { grid-template-columns: 1fr; }
      .search-box { flex-direction: column; align-items: stretch; }
      .search-button, .reset-button { width: 100%; }
      .news-card { padding: 1.2rem 1rem; flex-direction: column; gap: 1rem; }
      .news-card-thumb { width: 100%; height: 180px; }
      .container { width: min(1100px, 94%); padding: 1.2rem 0 2.5rem; }
      .page-title { font-size: clamp(1.8rem, 9vw, 2.4rem); }
      #result-info { text-align: left; padding: 0.2rem 0; }
      .news-title { font-size: 1.05rem; }
      .news-body { font-size: 0.9rem; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo-container">
      <div id="logo-area"></div>
      <span class="nav-logo-text">光一天</span>
    </a>
    <div class="nav-links" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">チーム紹介</a>
      <a href="works.html">作品一覧</a>
      <a href="news.html" class="active">お知らせ</a>
      <a href="contact.html">連絡先</a>
      <a href="10th-anniv.html" class="nav-anniv-btn">10周年記念公演</a>
      <a href="sponsors.html" class="nav-sponsors-btn">協賛</a>
    </div>
    <div class="hamburger" onclick="toggleMenu()" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="container">
    <div class="page-head">
      <h1 class="page-title serif">お知らせ一覧</h1>
      <p class="page-desc">最新のお知らせを一覧で確認できます。</p>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input id="search-input" class="search-input" type="search" placeholder="タイトル・本文を検索" autocomplete="off">
        <button id="search-button" class="search-button" type="button" onclick="loadNews()">検索</button>
        <button id="reset-button" class="reset-button" type="button" onclick="document.getElementById('search-input').value=''; loadNews();">解除</button>
      </div>
      <div id="result-info" class="status"></div>
    </div>

    <div id="news-list" class="news-list">
      <div class="status">読み込み中...</div>
    </div>
  </div>

  <script src="shared/site-shell.js"></script>
  <script>
    async function init() {
      const assets = await loadSharedLogo();
      loadNews();
    }

    function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }

    // JSONパースエラーを完全に防ぐセーフ関数
    async function safeFetchJSON(url) {
        try {
            const res = await fetch(url, { cache: 'no-cache' });
            if (!res.ok) return [];
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                // HTMLエラーページが返ってきた場合は空配列を返す
                return [];
            }
        } catch(e) {
            return [];
        }
    }

    async function loadNews() {
      const query = document.getElementById('search-input').value.trim();
      const list = document.getElementById('news-list');
      const info = document.getElementById('result-info');
      
      list.innerHTML = '<div class="status">読み込み中...</div>';
      
      try {
        const url = query ? `/api/content?type=news&q=${encodeURIComponent(query)}` : '/api/content?type=news';
        const data = await safeFetchJSON(url);
        
        info.textContent = query ? `検索結果: ${data.length}件` : '';
        
        if (!Array.isArray(data) || data.length === 0) {
            list.innerHTML = '<div class="empty">該当するお知らせはありません。</div>';
            return;
        }

        list.innerHTML = data.map(item => {
          const thumb = item.thumbnailUrl || item.image || (item.images && item.images.length > 0 ? item.images[0] : null);
          return `
          <a href="news-detail.html?id=${encodeURIComponent(item.id)}" class="news-card">
            ${thumb ? `<img src="${escapeHtml(thumb)}" class="news-card-thumb" alt="" loading="lazy">` : ''}
            <div class="news-card-content">
              <div class="news-meta">
                ${item.date ? `<span class="news-date">${escapeHtml(item.date)}</span>` : ''}
                ${item.tag ? `<span class="news-tag">${escapeHtml(item.tag)}</span>` : ''}
              </div>
              <div class="news-title">${escapeHtml(item.title || '')}</div>
              <div class="news-body">${escapeHtml(item.body || '')}</div>
            </div>
          </a>
        `}).join('');
      } catch (error) {
        list.innerHTML = `<div class="status error">読み込みに失敗しました。</div>`;
      }
    }

    document.getElementById('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); loadNews(); }});
    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script src="anniv-visibility.js"></script>
</body>
</html>
