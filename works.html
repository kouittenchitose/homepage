<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>作品一覧 | 光一天</title>

  <link rel="stylesheet" href="shared/site-nav.css">
  <style>
    :root {
      --primary: #facc15; --primary-hover: #eab308; --anniv-color: #ef4444;
      --bg-main: #f5f5f7; --bg-surface: #ffffff;
      --text-main: #1d1d1f; --text-sub: #86868b;
      --line: #e5e5ea; --shadow: 0 10px 40px rgba(0,0,0,0.06);
      --nav-height: 64px; --font-serif: 'Shippori Mincho', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; padding-top: var(--nav-height); }
    h1, h2, h3, .serif { font-family: var(--font-serif); }

    .page-header { padding: 3rem 4% 1.5rem; text-align: center; }
    .page-title { font-size: clamp(2.4rem, 8vw, 3.8rem); font-weight: 800; margin-bottom: 1rem; color: var(--text-main); }

    .works-section { padding: 1.5rem 4% 4rem; max-width: 1000px; margin: 0 auto; }
    .work-card { 
      display: block; text-decoration: none; color: inherit;
      background: var(--bg-surface); border-radius: 28px; padding: 1.8rem; 
      margin-bottom: 2rem; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02);
      transition: 0.3s;
    }
    .work-card:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0,0,0,0.08); }
    
    .work-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; border-bottom: 2px solid var(--primary); padding-bottom: 0.4rem; }
    .work-header-left { display: flex; align-items: baseline; gap: 1rem; }
    .work-year { font-weight: 800; font-size: 1.1rem; color: var(--text-sub); }
    .work-title { font-size: 1.7rem; font-weight: 800; color: var(--text-main); overflow-wrap: anywhere; }
    .work-more { font-size: 0.9rem; font-weight: bold; color: var(--primary-hover); }

    .work-content { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    .work-story { font-size: 0.95rem; color: #444; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .work-awards { background: #fffcf0; padding: 1.2rem; border-radius: 16px; border-left: 4px solid var(--primary); }
    .award-item { font-size: 0.9rem; font-weight: 700; color: #b42318; display: block; margin-bottom: 4px; }

    .fade-up { opacity: 0; transform: translateY(20px); transition: 0.6s ease-out; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 860px) {
      .work-card { padding: 1.5rem; }
      .work-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
      .works-section { padding: 1rem 5% 2.5rem; }
      .work-title { font-size: 1.36rem; }
      .work-awards { padding: 0.9rem; border-radius: 12px; }
      .award-item { font-size: 0.86rem; }
    }
  </style>
</head>

    async function init() {
      await loadSharedLogo();

      let worksData = [];
      try {
        const res = await fetch('/api/content?type=works', { cache: 'no-cache' });
        const text = await res.text();
        worksData = JSON.parse(text);
      } catch(e) {
        worksData = [];
      }

      // データが空ならデフォルトを使用
      if(!Array.isArray(worksData) || worksData.length === 0) {
          worksData = defaultWorks;
      }

      const container = document.getElementById('works-container');
      container.innerHTML = worksData.map(work => `
      <a href="work-detail.html?id=${encodeURIComponent(work.id)}" class="work-card fade-up">
          <div class="work-header">
            <div class="work-header-left">
              <span class="work-year">${work.year}</span>
              <h2 class="work-title serif">${work.title}</h2>
            </div>
            <span class="work-more">詳細を見る →</span>
          </div>
          <div class="work-content">
          ${work.story ? `<p class="work-story">${work.story}</p>` : ''}
          ${work.awards && work.awards.length > 0 && work.awards[0] !== "" ? `
              <div class="work-awards">
              ${work.awards.map(a => `<span class="award-item">🏆 ${a}</span>`).join('')}
              </div>
          ` : ''}
          </div>
      </a>
      `).join('');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    init();
  </script>
